<!DOCTYPE html>
<html lang="en">
<head>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <style>
    :root {
      --dark-bg: #0a0a0f;
      --card-bg: rgba(255, 255, 255, 0.08);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      transition: 0.3s ease;
    }

    body {
      background: var(--dark-bg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
    }

    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: var(--dark-bg);
    }

    .bg-animation::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background: radial-gradient(
          circle at 20% 50%,
          rgba(102, 126, 234, 0.15) 0%,
          transparent 50%
        ),
        radial-gradient(
          circle at 80% 20%,
          rgba(118, 75, 162, 0.15) 0%,
          transparent 50%
        ),
        radial-gradient(
          circle at 40% 80%,
          rgba(79, 172, 254, 0.15) 0%,
          transparent 50%
        );
      animation: float 20s ease-in-out infinite;
    }

    .container {
      width: 100%;
      max-width: 600px;
      max-height: 1000px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      position: relative;
      z-index: 1;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 26px;
      color: var(--text-primary);
    }

    .input-box {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #taskInput {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 16px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    #taskInput::placeholder {
      color: var(--text-secondary);
    }

    /* Active/focus state matching page colors */
    #taskInput:focus {
      outline: none;
      border-color: rgba(102,126,234,0.95);
      box-shadow: 0 6px 20px rgba(102,126,234,0.18), 0 0 0 4px rgba(102,126,234,0.08);
      background: rgba(255,255,255,0.04);
    }

    button {
      padding: 10px 16px;
      border: none;
      background: rgba(102, 126, 234, 0.8);
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    button:hover {
      background: rgba(102, 126, 234, 1);
    }

    ul {
      list-style: none;
      margin-top: 20px;
      max-height: calc(1000px - 200px);
      overflow-y: auto;
      flex: 1;
    }

    li {
      background: rgba(255, 255, 255, 0.08);
      padding: 12px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
    }

    li.completed {
      background: rgba(40, 167, 69, 0.2);
      border-color: rgba(40, 167, 69, 0.5);
      color: var(--text-secondary);
      opacity: 0.65;
    }

    /* Strike through the task text when an item is completed */
    li.completed .task-text {
      text-decoration: line-through;
      color: var(--text-secondary);
    }

    .btns button {
      margin-left: 8px;
      background: #ff4747;
      text-decoration: none;
    }

    .btns button {
      margin-left: 8px;
      background: #ff4747;
    }

    .btns button.complete-btn {
      background: #28a745;
    }

    .btns button.edit-btn {
      background: #ffc107;
      color: #000;
    }

    .btns button:hover {
      opacity: 0.85;
    }

    /* Edit mode styles */
    li.edit-mode {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    li.edit-mode .task-text {
      display: none;
    }

    .edit-input-box {
      display: flex;
      gap: 8px;
      width: 100%;
      align-items: center;
    }

    .edit-input-box input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
      font-size: 14px;
    }

    .edit-input-box input:focus {
      outline: none;
      border-color: rgba(102,126,234,0.95);
      box-shadow: 0 0 0 3px rgba(102,126,234,0.08);
    }

    .edit-input-box button {
      padding: 8px 12px;
      margin: 0;
      font-size: 12px;
    }

    .edit-input-box .save-btn {
      background: #28a745;
    }

    .edit-input-box .cancel-btn {
      background: #6c757d;
    }

    /* Filter buttons */
    .filter-buttons {
      display: flex !important;
      gap: 10px;
      margin-top: 20px;
      justify-content: center;
    }

    .filter-btn {
      padding: 8px 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .filter-btn:hover {
      background: rgba(102, 126, 234, 0.3);
      border-color: rgba(102, 126, 234, 0.5);
    }

    .filter-btn.active {
      background: rgba(102, 126, 234, 0.8);
      border-color: rgba(102, 126, 234, 0.95);
    }

    /* Priority badges */
    .priority {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      margin-right: 10px;
      text-transform: capitalize;
    }
    .priority.low { background: rgba(40, 167, 69, 0.15); color: #8fe08f; border: 1px solid rgba(40,167,69,0.25); }
    .priority.medium { background: rgba(255, 165, 0, 0.12); color: #ffcd6b; border: 1px solid rgba(255,165,0,0.18); }
    .priority.high { background: rgba(255, 71, 71, 0.12); color: #ffb3b3; border: 1px solid rgba(255,71,71,0.2); }

    /* Styled priority select to match input aesthetics */
    /* Custom-styled dropdown (replaces native select) */
    .custom-select {
      position: relative;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: var(--text-primary);
      font-size: 16px;
      cursor: pointer;
      min-width: 120px;
    }

    .custom-select .cs-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      gap: 8px;
    }

    .custom-select .cs-value { text-transform: capitalize; }

    .custom-select .cs-arrow {
      width: 12px;
      height: 8px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8"><path fill="%23ffffff" d="M6 8L0 0h12z"/></svg>') no-repeat center center;
      opacity: 0.95;
    }

    .custom-select.open { box-shadow: 0 6px 20px rgba(102,126,234,0.12), 0 0 0 4px rgba(102,126,234,0.04); }

    .cs-options {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      left: 0;
      background: rgba(10,10,15,0.96);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      padding: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      z-index: 50;
      display: none;
      max-height: 180px;
      overflow: auto;
    }

    .custom-select.open .cs-options { display: block; }

    .cs-option {
      padding: 8px 10px;
      border-radius: 8px;
      margin: 4px 0;
      cursor: pointer;
      color: var(--text-primary);
    }

    .cs-option:hover, .cs-option[aria-selected="true"] {
      background: rgba(102,126,234,0.12);
    }

    .cs-option[data-value="low"] { color: #8fe08f; }
    .cs-option[data-value="medium"] { color: #ffcd6b; }
    .cs-option[data-value="high"] { color: #ffb3b3; }

    @keyframes float {
      0%,
      100% {
        transform: translate(0, 0) rotate(0deg);
      }
      33% {
        transform: translate(20%, -10%) rotate(120deg);
      }
      66% {
        transform: translate(-20%, 10%) rotate(240deg);
      }
    }
  </style>
</head>
<body>
  <div class="bg-animation"></div>
  <div class="container">
    <h2>To-Do List</h2>

    <div class="input-box">
      <input type="text" id="taskInput" placeholder="Enter a new task..." />

      <div class="custom-select" id="taskPriority" role="listbox" aria-label="Priority" tabindex="0" data-value="medium">
        <div class="cs-trigger" aria-haspopup="listbox" aria-expanded="false">
          <span class="cs-value">Medium</span>
          <span class="cs-arrow" aria-hidden="true"></span>
        </div>
        <div class="cs-options" role="presentation">
          <div class="cs-option" role="option" data-value="low">Low</div>
          <div class="cs-option" role="option" data-value="medium" aria-selected="true">Medium</div>
          <div class="cs-option" role="option" data-value="high">High</div>
        </div>
      </div>

      <button onclick="addTask()">Add</button>
    </div>


    <div id="filterButtons" class="filter-buttons" style="display: none; gap: 10px; margin-top: 20px; display: flex; justify-content: center;">
      <button class="filter-btn active" data-filter="all" onclick="filterTasks('all')">All</button>
      <button class="filter-btn" data-filter="low" onclick="filterTasks('low')">Low</button>
      <button class="filter-btn" data-filter="medium" onclick="filterTasks('medium')">Medium</button>
      <button class="filter-btn" data-filter="high" onclick="filterTasks('high')">High</button>
    </div>
        <div id="noTasksMessage" style="text-align: center; padding: 40px 20px; color: var(--text-secondary); font-size: 18px;">No Tasks</div>
    
    
    <ul id="taskList" style="display: none;"></ul>
  </div>

  <script>
    const input = document.getElementById("taskInput");
    const prioritySelect = document.getElementById("taskPriority");
    const list = document.getElementById("taskList");

    // Initialize custom select behavior (if using the custom div)
    (function initCustomSelect() {
      if (!prioritySelect) return;
      const trigger = prioritySelect.querySelector('.cs-trigger');
      const options = prioritySelect.querySelectorAll('.cs-option');
      const optsList = prioritySelect.querySelector('.cs-options');

      function close() {
        prioritySelect.classList.remove('open');
        trigger.setAttribute('aria-expanded', 'false');
      }

      function open() {
        prioritySelect.classList.add('open');
        trigger.setAttribute('aria-expanded', 'true');
      }

      function setValue(val) {
        prioritySelect.dataset.value = val;
        const valSpan = prioritySelect.querySelector('.cs-value');
        valSpan.textContent = val.charAt(0).toUpperCase() + val.slice(1);
        options.forEach(o => o.removeAttribute('aria-selected'));
        const sel = prioritySelect.querySelector(`.cs-option[data-value="${val}"]`);
        if (sel) sel.setAttribute('aria-selected', 'true');
      }

      // click on trigger toggles
      trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        if (prioritySelect.classList.contains('open')) close(); else open();
      });

      // option clicks
      options.forEach(opt => {
        opt.addEventListener('click', (e) => {
          e.stopPropagation();
          const v = opt.dataset.value;
          setValue(v);
          close();
        });
      });

      // keyboard support
      prioritySelect.addEventListener('keydown', (e) => {
        const openFlag = prioritySelect.classList.contains('open');
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          if (openFlag) {
            // choose focused option
            const focused = optsList.querySelector('[data-focus]') || prioritySelect.querySelector('.cs-option[aria-selected="true"]');
            if (focused) { setValue(focused.dataset.value); }
            close();
          } else open();
        } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          if (!openFlag) open();
          const current = optsList.querySelector('[data-focus]') || optsList.querySelector('.cs-option[aria-selected="true"]');
          let next = null;
          if (!current) next = optsList.querySelector('.cs-option');
          else if (e.key === 'ArrowDown') next = current.nextElementSibling || current;
          else next = current.previousElementSibling || current;
          optsList.querySelectorAll('.cs-option').forEach(o => o.removeAttribute('data-focus'));
          if (next) next.setAttribute('data-focus', 'true');
          next && next.scrollIntoView({block: 'nearest'});
        } else if (e.key === 'Escape') {
          close();
        }
      });

      // close when clicking outside
      document.addEventListener('click', (e) => {
        if (!prioritySelect.contains(e.target)) close();
      });
    })();

    function getPriorityValue() {
      if (!prioritySelect) return 'medium';
      // native select
      if (prioritySelect.tagName && prioritySelect.tagName.toLowerCase() === 'select') return prioritySelect.value;
      // custom div
      return prioritySelect.dataset.value || 'medium';
    }

    // Load saved tasks on startup
    window.onload = function () {
      const saved = JSON.parse(localStorage.getItem("tasks")) || [];
      saved.forEach(t => createTask(t.text, t.completed, t.priority || 'medium'));
      updateTaskDisplay();
    };

    function addTask() {
      const value = input.value.trim();
      if (value === "") return;
      const pr = getPriorityValue();
      createTask(value, false, pr);
      saveTasks();

      input.value = "";
    }

    function createTask(text, completed, priority = 'medium') {
      const li = document.createElement("li");
      if (completed) li.classList.add("completed");

      li.innerHTML = `
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="priority ${priority}" data-priority="${priority}">${priority}</span>
          <span class="task-text">${text}</span>
        </div>
        <div class="btns">
          <button class="complete-btn" onclick="toggleComplete(this)">✓</button>
          ${!completed ? '<button class="edit-btn" onclick="editTask(this)"><i class="fa-regular fa-pen-to-square"></i></button>' : ''}
          <button onclick="deleteTask(this)"><i class="fa-regular fa-trash-can"></i></button>
        </div>
      `;

      list.appendChild(li);
    }

    function toggleComplete(btn) {
      const li = btn.parentElement.parentElement;
      li.classList.toggle("completed");
      
      const editBtn = li.querySelector(".edit-btn");
      if (li.classList.contains("completed")) {
        // Mark as completed - hide edit button
        if (editBtn) editBtn.remove();
      } else {
        // Mark as incomplete - show edit button
        const editButton = document.createElement("button");
        editButton.className = "edit-btn";
        editButton.onclick = function() { editTask(this); };
        editButton.innerHTML = '<i class="fa-regular fa-pen-to-square"></i>';
        const btnsContainer = btn.parentElement;
        // Insert after complete button (which is the first button)
        btnsContainer.insertBefore(editButton, btnsContainer.children[1]);
      }
      
      saveTasks();
    }

    function editTask(btn) {
      const li = btn.parentElement.parentElement;
      const taskText = li.querySelector(".task-text").innerText;
      
      // Enter edit mode
      li.classList.add("edit-mode");
      
      // Get the task-text container to insert edit input
      const taskContainer = li.querySelector("div:first-child");
      
      // Create edit input box
      const editBox = document.createElement("div");
      editBox.className = "edit-input-box";
      editBox.innerHTML = `
        <input type="text" class="edit-input" value="${taskText}" />
        <button class="save-btn" onclick="saveEdit(this)">Save</button>
        <button class="cancel-btn" onclick="cancelEdit(this)">Cancel</button>
      `;
      
      // Insert after the priority and task-text
      taskContainer.parentElement.insertBefore(editBox, taskContainer.nextSibling);
      
      // Focus on input
      editBox.querySelector(".edit-input").focus();
    }

    function saveEdit(btn) {
      const li = btn.parentElement.parentElement;
      const newText = li.querySelector(".edit-input").value.trim();
      
      if (newText === "") {
        alert("Task cannot be empty!");
        return;
      }
      
      // Update task text
      li.querySelector(".task-text").innerText = newText;
      
      // Exit edit mode
      li.classList.remove("edit-mode");
      li.querySelector(".edit-input-box").remove();
      
      saveTasks();
    }

    function cancelEdit(btn) {
      const li = btn.parentElement.parentElement;
      
      // Exit edit mode
      li.classList.remove("edit-mode");
      li.querySelector(".edit-input-box").remove();
    }

    function deleteTask(btn) {
      btn.parentElement.parentElement.remove();
      saveTasks();
    }

    let currentFilter = 'all';

    function filterTasks(priority) {
      currentFilter = priority;
      const taskList = document.getElementById("taskList");
      const tasks = taskList.querySelectorAll("li");
      
      tasks.forEach(li => {
        const prEl = li.querySelector(".priority");
        const taskPriority = prEl ? prEl.dataset.priority : 'medium';
        
        if (priority === 'all' || taskPriority === priority) {
          li.style.display = "flex";
        } else {
          li.style.display = "none";
        }
      });

      // Update active button state
      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.classList.remove("active");
      });
      document.querySelector(`[data-filter="${priority}"]`).classList.add("active");
    }

    function saveTasks() {
      const tasks = [];
      document.querySelectorAll("li").forEach(li => {
        const textEl = li.querySelector(".task-text");
        const prEl = li.querySelector(".priority");
        tasks.push({
          text: textEl ? textEl.innerText : li.querySelector("span").innerText,
          completed: li.classList.contains("completed"),
          priority: prEl ? prEl.dataset.priority || prEl.innerText.toLowerCase() : 'medium'
        });
      });
      localStorage.setItem("tasks", JSON.stringify(tasks));
      updateTaskDisplay();
    }

    function updateTaskDisplay() {
      const taskList = document.getElementById("taskList");
      const noTasksMessage = document.getElementById("noTasksMessage");
      const filterButtons = document.getElementById("filterButtons");
      
      if (taskList.children.length === 0) {
        noTasksMessage.style.display = "block";
        taskList.style.display = "none";
        filterButtons.style.display = "none";
      } else {
        noTasksMessage.style.display = "none";
        taskList.style.display = "block";
        filterButtons.style.display = "flex";
        filterTasks(currentFilter);
      }
    }
  </script>
</body>
</html>
